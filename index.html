<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة الصيانة</title>
<style>
body{font-family:Arial;background:#f1f3f5;margin:0;color:#263238}
header{background:#263238;color:white;padding:22px;text-align:center}
main{max-width:500px;margin:30px auto;padding:15px}
.card{background:white;padding:22px;margin:15px 0;border-radius:12px}
input,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box;border-radius:7px}
input{border:1px solid #ccc}
button{background:#37474f;color:white;border:0;font-size:16px}
#message{white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h2>نظام إدارة الصيانة</h2>
<p>Maintenance Management System</p>
</header>
<main>
<div class="card">
<h3>تسجيل الدخول</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="login">دخول</button>
<button id="logout" hidden>تسجيل الخروج</button>
<p id="message">جاهز لتسجيل الدخول</p>
</div>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://jakozzeeomgfphezticw.supabase.co';
const SUPABASE_KEY = 'ضع_المفتاح_هنا';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const message = document.getElementById('message');

document.getElementById('login').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    message.textContent = 'اكتب البريد الإلكتروني وكلمة المرور';
    return;
  }

  message.textContent = 'جاري تسجيل الدخول...';

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = 'تعذر تسجيل الدخول: ' + error.message;
    return;
  }

  message.textContent = 'تم تسجيل الدخول بنجاح: ' + data.user.email;
  document.getElementById('logout').hidden = false;
};

document.getElementById('logout').onclick = async () => {
  await supabase.auth.signOut();
  message.textContent = 'تم تسجيل الخروج';
  document.getElementById('logout').hidden = true;
};
</script>
</body>
</html>
